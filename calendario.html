<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://elegance-backend-hrho.onrender.com; connect-src 'self' https://elegance-backend-hrho.onrender.com https://viacep.com.br http://127.0.0.1:3917; object-src 'self' blob:; frame-src blob:; base-uri 'self'; form-action 'self'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#14161a">
    <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Elegance">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Elegance Dashboard - Calendário de pedidos</title>
    <link rel="stylesheet" href="calendario.css?v=202611171230">
    <link rel="stylesheet" href="tema.css?v=202611161500">
    <script src="layout.js?v=202611091200" defer></script>
    <script src="entregas_comum.js?v=202610271400" defer></script>
    <script src="calendario_comum.js?v=202611171230" defer></script>
    <script src="inicio_menu.js?v=202611111200" defer></script>
    <script src="escolha_data_entrega.js?v=202610301300" defer></script>
    <script src="alterar_data_pronto.js?v=202611051200" defer></script>
    <script src="calculo/desconto_pedido.js?v=202611101600" defer></script>
    <script src="desconto_pedido_tela.js?v=202611161500" defer></script>
    <script src="danfe_pedido.js?v=202611051300" defer></script>
    <script src="etiqueta_zebra.js?v=202611041200" defer></script>
    <script src="checklist_pedido.js?v=202611051700" defer></script>
    <script src="calendario.js?v=202611171230" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo" id="user-empresa"></div>
            <div class="user-profile">
                <div class="user-avatar" id="user-avatar">E</div>
                <div class="user-info">
                    <span id="user-name">Usuário</span>
                    <span class="user-cargo" id="user-cargo"></span>
                </div>
            </div>
        </header>
        <nav class="sidebar">
            <div class="menu-title">Menu Principal</div>
        </nav>
        <main>
            <div class="titulo-linha">
                <h1 class="welcome-title">Calendário de pedidos</h1>
                <div id="cal-visao" class="tipo-toggle" role="group" aria-label="Como mostrar os pedidos"></div>
            </div>
            <p class="welcome-subtitle">Previsão de finalização dos pedidos (data de pronto). Clique em um dia para ver a lista completa.</p>

            <section class="painel" id="cal-corpo">
                <div class="cal-fixo" id="cal-fixo">
                <div class="cal-topo">
                    <button type="button" class="btn btn-mini btn-secondary" data-mes="-1" aria-label="Mês anterior">‹</button>
                    <button type="button" class="btn btn-mini btn-secondary" data-mes="0">Hoje</button>
                    <button type="button" class="btn btn-mini btn-secondary" data-mes="1" aria-label="Próximo mês">›</button>
                    <h2 id="cal-titulo" aria-live="polite"></h2>
                    <span class="cinza" id="cal-resumo"></span>
                    <div id="cal-situacao"></div>
                    <button type="button" class="btn btn-mini btn-secondary btn-imprimir" data-imprimir aria-label="Imprimir a lista do mês">Imprimir</button>
                </div>
                <div class="cal-busca" role="search">
                    <label for="cal-busca" class="cal-busca-rotulo">Pesquisar</label>
                    <div class="busca cal-busca-campo">
                        <input type="search" id="cal-busca" placeholder="Nº do pedido, cliente ou cliente final" autocomplete="off" aria-describedby="cal-busca-resultado">
                    </div>
                    <button type="button" class="btn btn-mini btn-secondary" id="cal-busca-limpar" hidden aria-label="Limpar pesquisa">Limpar</button>
                    <button type="button" class="btn btn-mini btn-secondary" id="cal-busca-ant" hidden aria-label="Resultado anterior">‹ Anterior</button>
                    <button type="button" class="btn btn-mini btn-secondary" id="cal-busca-prox" hidden aria-label="Próximo resultado">Próximo ›</button>
                    <span class="cinza" id="cal-busca-resultado" role="status" aria-live="polite"></span>
                </div>
                </div>
                <div id="cal-grade"></div>
                <div id="cal-lista" class="cal-lista"></div>
                <div id="cal-folha" class="cal-folha"></div>
                <p class="cinza cal-ajuda">Clique com o botão direito em um pedido (ou use a tecla de menu / Shift+F10) para alterar a data de pronto, mudar a situação e abrir PDFs.</p>
            </section>
        </main>
    </div>
    <div id="toasts" aria-live="polite"></div>
</body>
</html>
