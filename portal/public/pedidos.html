<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus pedidos</title>
  <link rel="stylesheet" href="portal.css">
</head>
<body>
  <main class="larga">
    <h1>Meus pedidos</h1>
    <div class="tabela-rolagem">
      <table class="pedidos">
        <thead>
          <tr>
            <th scope="col">Número</th>
            <th scope="col">Data</th>
            <th scope="col">Situação</th>
            <th scope="col">Entrega</th>
            <th scope="col">Previsão/Data</th>
          </tr>
        </thead>
        <tbody id="corpo"></tbody>
      </table>
    </div>
    <div class="acoes">
      <button type="button" id="anterior" class="secundario" disabled>Anterior</button>
      <button type="button" id="proxima" class="secundario" disabled>Próxima</button>
    </div>
    <p id="erro" class="erro" role="alert" aria-live="assertive"></p>
    <p><a href="inicio.html">Voltar ao início</a></p>
  </main>
  <script src="portal.js"></script>
  <script src="pedidos.js"></script>
</body>
</html>
