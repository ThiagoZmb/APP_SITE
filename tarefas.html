<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://elegance-backend-hrho.onrender.com; connect-src 'self' https://elegance-backend-hrho.onrender.com; object-src 'self' blob:; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegance Dashboard - Minha semana</title>
    <style>
        /* casca, botões, cores e as faixas/legenda/menu da agenda: tema.css (bloco AGENDAS, DESIGN.md); aqui só a grade da semana */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { color: var(--text-dark); min-height: 100vh; }
        .barra-semana { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
        /* a agenda usa a largura e a altura da janela */
        html body .container > main { max-width: none !important; }
        main > .welcome-subtitle { margin-bottom: 8px !important; }
        @media (min-width: 961px) { html body .container > main { padding-left: 20px !important; padding-right: 20px !important; padding-bottom: 24px !important; } }
        .barra-semana .btn { min-height: 40px; min-width: 40px; }
        .rotulos { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-left: 6px; }
        .rotulo-mes { font-size: 17px; font-weight: 700; }
        .rotulo-semana { font-family: var(--font-mono) !important; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text-light); }
        /* ordem de leitura = ordem do DOM (Segunda -> Domingo, Tarefas, Notas); a largura que vale é a da área, já sem o menu lateral */
        .semana-area { container-type: inline-size; }
        .semana { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
        .q-tar, .q-not { grid-column: span 2; }
        .semana > .vazio { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-light); }
        .quadro { background: var(--white); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 8px 8px 10px; min-width: 0; scroll-margin-top: 32px; }
        .quadro h2 { font-size: inherit; }
        /* tela larga: uma fileira com os sete dias; 14 trilhas para Tarefas e Notas dividirem a largura embaixo */
        @container (min-width: 960px) {
            .semana { grid-template-columns: repeat(14, minmax(0, 1fr)); }
            .quadro { grid-column: span 2; padding-left: 6px; padding-right: 6px; }
            .q-tar, .q-not { grid-column: span 7; }
        }
        .sino { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 28px; border: 0; background: transparent; color: inherit; cursor: pointer; opacity: .6; border-radius: var(--radius-sm); }
        .sino svg { width: 15px; height: 15px; }
        .sino:hover, .sino:focus-visible, .linha:focus-within .sino, .sino.marcado { opacity: 1; }
        .sino.vazia { visibility: hidden; }
        .linha-hora { font-size: 11px; line-height: 14px; color: var(--primary-color); padding-bottom: 3px; font-variant-numeric: tabular-nums; }
        .alarme-escolha { margin: auto !important; width: min(380px, calc(100vw - 32px)); }
        .alarme-escolha .dlg-cab p { overflow-wrap: anywhere; }
        .alarme-escolha input { width: 100%; min-height: 44px; padding: 8px 10px; font-size: 16px; }
        .alarme-escolha .dlg-rodape .btn { min-height: 40px; }
        .linha-aviso { font-size: 12px; color: var(--danger-fg); padding-bottom: 4px; }
        .aviso-semana { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--danger-bg); border: 1px solid var(--danger-borda); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; font-size: 14px; }
        #toasts { position: fixed; right: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
        .toast { min-width: 260px; max-width: 380px; font-size: 14px; }
        @media (pointer: coarse) { .sino { width: 36px; height: 42px; } .alarme-escolha .dlg-rodape .btn { min-height: 44px; } .barra-semana .btn { min-height: 44px; min-width: 44px; } }
        @media (max-width: 700px) {
            .semana { display: flex; flex-direction: column; }
            .q-tar, .q-not { grid-column: auto; }
            .rotulos { flex-basis: 100%; margin-left: 0; order: -1; }
            #toasts { left: 16px; right: 16px; bottom: 16px; }
            .toast { min-width: 0; }
        }
    </style>
    <link rel="stylesheet" href="tema.css?v=202612031200">
    <script src="layout.js?v=202611301000" defer></script>
    <script src="entregas_comum.js?v=202611281000" defer></script>
    <script src="calculo/agenda_horario.js?v=202612021200" defer></script>
    <script src="agenda_comum.js?v=202612031200" defer></script>
    <script src="calculo/agenda_repeticao.js?v=202612011200" defer></script>
    <script src="tarefas.js?v=202612031200" defer></script>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo" id="user-empresa"></div>
            <div class="user-profile">
                <div class="user-avatar" id="user-avatar">E</div>
                <div class="user-info">
                    <span id="user-name">Usuário</span>
                    <span class="user-cargo" id="user-cargo"></span>
                </div>
            </div>
        </header>
        <nav class="sidebar">
            <div class="menu-title">Menu Principal</div>
        </nav>
        <main>
            <h1 class="welcome-title">Minha semana</h1>
            <p class="welcome-subtitle">Seu caderno de tarefas. Só você vê o que escreve aqui.</p>

            <div class="ag-corpo">
            <aside class="ag-lateral" id="lateral" aria-label="Categorias">
                <button type="button" class="ag-lat-alternar" id="lateral-alternar" aria-expanded="false" aria-controls="lateral-corpo">Categorias</button>
                <h2 class="ag-lat-titulo">Categorias</h2>
                <div class="ag-lat-corpo" id="lateral-corpo">
                    <div class="ag-legenda" id="legenda" role="group" aria-label="Mostrar e esconder categorias" hidden></div>
                    <button type="button" class="btn btn-secondary btn-mini" id="btn-categorias" data-perm="tarefas_admin.usar">Gerenciar categorias</button>
                </div>
            </aside>
            <div class="ag-principal">
            <div class="barra-semana">
                <button type="button" class="btn btn-secondary btn-mini" id="btn-anterior" aria-label="Semana anterior">‹</button>
                <button type="button" class="btn btn-secondary btn-mini" id="btn-hoje">Hoje</button>
                <button type="button" class="btn btn-secondary btn-mini" id="btn-proxima" aria-label="Próxima semana">›</button>
                <div class="rotulos" aria-live="polite">
                    <span class="rotulo-mes" id="rotulo-mes"></span>
                    <span class="rotulo-semana" id="rotulo-semana"></span>
                </div>
            </div>
            <div class="aviso-semana" id="aviso-semana" role="alert" hidden>
                <span id="aviso-texto"></span>
                <button type="button" class="btn btn-secondary btn-mini" id="btn-tentar">Tentar de novo</button>
            </div>
            <div class="semana-area"><div class="semana agenda" id="semana"></div></div>
            </div>
            </div>
        </main>
    </div>
    <div id="toasts" aria-live="polite"></div>
</body>
</html>
