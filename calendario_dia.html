    <script src="layout.js?v=202611091200" defer></script>
    <script src="entregas_comum.js?v=202611201000" defer></script>
    <script src="calendario_comum.js?v=202611201000" defer></script>

    <script src="escolha_data_entrega.js?v=202610301300" defer></script>

    <script src="calculo/desconto_pedido.js?v=202611101600" defer></script>

</head>
<body>
    <div class="container">
        <header>
            <div class="logo" id="user-empresa"></div>
            <div class="user-profile">
                <div class="user-avatar" id="user-avatar">E</div>
                <div class="user-info">
                    <span id="user-name">Usuário</span>
                    <span class="user-cargo" id="user-cargo"></span>
                </div>
            </div>
        </header>
        <nav class="sidebar">
            <div class="menu-title">Menu Principal</div>
        </nav>
        <main>
            <h1 class="welcome-title">Pedidos do dia</h1>
            <p class="welcome-subtitle">Pedidos com previsão de finalização neste dia.</p>
            <a class="voltar-cal" id="dia-voltar" href="calendario.html">← Voltar ao calendário</a>

            <section class="painel">
                <div class="dia-topo">
                    <a class="btn btn-mini btn-secondary btn-link" id="dia-anterior" href="#" aria-label="Dia anterior">‹</a>
                    <a class="btn btn-mini btn-secondary btn-link" id="dia-hoje" href="#">Hoje</a>
                    <a class="btn btn-mini btn-secondary btn-link" id="dia-proximo" href="#" aria-label="Próximo dia">›</a>
                    <h2 id="dia-titulo" aria-live="polite"></h2>
                </div>
                <div class="dia-sub">
                    <span class="cinza" id="dia-resumo"></span>
                    <div id="dia-situacao"></div>
                </div>
                <ul class="lista-dia" id="dia-lista"><li class="vazio">Carregando...</li></ul>
            </section>
            <p class="cinza cal-ajuda">Clique com o botão direito em um pedido (ou use o botão Ações) para alterar a data de pronto, mudar a situação e abrir PDFs.</p>
        </main>
    </div>
    <div id="toasts" aria-live="polite"></div>
</body>
</html>
