<!DOCTYPE html>
<html lang="pt-br">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegance Dashboard - Livro de regras</title>
    <link rel="stylesheet" href="regras.css?v=202611231800">
    <link rel="stylesheet" href="tema.css?v=202612011200">

    <script src="entregas_comum.js?v=202611281000" defer></script>

<body>
    <div class="container">
        <header>
            <div class="logo" id="user-empresa"></div>
            <div class="user-profile">
                <div class="user-avatar" id="user-avatar">E</div>
                <div class="user-info">
                    <span id="user-name">Usuário</span>
                    <span class="user-cargo" id="user-cargo"></span>
                </div>
            </div>
        </header>
        <nav class="sidebar">
            <div class="menu-title">Menu Principal</div>
        </nav>
        <main>
            <h1 class="welcome-title">Livro de regras</h1>
            <p class="welcome-subtitle">As regras que o sistema confere ao adicionar um item ou salvar um orçamento ou pedido. Três níveis: Bloqueia não deixa adicionar nem salvar; Pergunta pede confirmação antes de seguir; Avisa mostra um alerta, mas deixa seguir.</p>

            <section class="painel">
                <div class="tabela-wrap" id="regras-corpo"><p class="vazio">Carregando…</p></div>
            </section>

            <section class="painel">
                <div class="painel-corpo">
                    <h2>Limites atuais</h2>
                    <div id="limites"></div>
                </div>
            </section>
        </main>
    </div>
    <div id="toasts" aria-live="polite"></div>
</body>
